        --dark-bg: #121212;
        --card-bg: #1e1e1e;
        --text-main: #f5f5f5;
        --text-muted: #a0a0a0;
        --white: #ffffff;
        --border-gold: rgba(255, 42, 42, 0.3); /* Borde rojo sutil */

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Montserrat', sans-serif;
      }

      body {
        background-color: var(--dark-bg);
        color: var(--text-main);
        line-height: 1.6;
      }

      header {
        background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
        border-bottom: 2px solid var(--primary-gold);
        padding: 1.5rem 1rem;
        text-align: center;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* Estilo para el logo oficial en el header */
      .brand-logo {
        max-width: 260px;
        width: 100%;
        height: auto;
        object-fit: contain;
        margin-bottom: 0.4rem;
        filter: drop-shadow(0 0 8px rgba(255, 42, 42, 0.3));

      .brand-subtitle {
        color: var(--text-muted);
        font-size: 1.1rem;
        font-weight: 300;

        position: absolute;
        top: 1rem;
        right: 1rem;
        background: transparent;
        border: 1px solid var(--border-gold);
        color: var(--primary-gold);
        padding: 0.5rem 1rem;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        z-index: 10;
      }

      .admin-btn:hover {
        background: var(--primary-gold);
        color: #fff;
      }

      .container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1rem;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .search-bar {
        position: relative;
        width: 100%;
      }

      .search-bar input {
        width: 100%;
        padding: 0.8rem 1rem 0.8rem 2.5rem;
        background: var(--card-bg);
        border: 1px solid var(--border-gold);
        border-radius: 8px;
        color: var(--text-main);
      }

      .search-bar i {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--primary-gold);
      }

      .filter-tags {
        display: flex;
        gap: 0.5rem;
        overflow-x: auto;
        padding-bottom: 0.5rem;
        white-space: nowrap;
      }

      .filter-tags::-webkit-scrollbar {
        height: 6px;
      }

      .filter-tags::-webkit-scrollbar-thumb {
        background: var(--primary-gold);
        border-radius: 3px;
      }

      .tag-btn {
        background: var(--card-bg);
        border: 1px solid var(--border-gold);
        color: var(--text-main);
        padding: 0.5rem 1rem;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.85rem;
      }

      .tag-btn.active {
        background: var(--primary-gold);
        color: #fff;
        font-weight: 600;
      }

      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 1.5rem;
      }

      .product-card {
        background: var(--card-bg);
        border: 1px solid var(--border-gold);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.3s ease;
      }

      .product-card:hover {
        transform: translateY(-5px);
      }

      .product-img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        background: #222;
      }

      .product-info {
        padding: 1.2rem;
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      .product-title {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--white);
      }

      .product-desc {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 1rem;
        flex: 1;
      }

      .product-price {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--primary-gold);
        margin-bottom: 1rem;
      }

        width: 100%;
        background: #25d366;
        color: white;
        border: none;
        padding: 0.8rem;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        text-decoration: none;

        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 1rem;

      .modal.active {
        display: flex;
      }

      .modal-content {
        background: var(--card-bg);
        border: 1px solid var(--primary-gold);
        padding: 2rem;
        border-radius: 12px;
        max-width: 600px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        position: relative;
      }

      .close-btn {
        position: absolute;
        top: 1rem;
        right: 1rem;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 1.8rem;
      }

      .form-group {
        margin-bottom: 1.2rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.4rem;
        color: var(--primary-gold);
      }

      .form-group input,
      .form-group textarea,

        width: 100%;
        padding: 0.8rem;
        background: #121212;
        border: 1px solid var(--border-gold);
        color: white;
        border-radius: 6px;

        background: var(--primary-gold);
        color: white;
        font-weight: bold;
        padding: 0.8rem;
        border: none;
        border-radius: 6px;

        border-radius: 6px;
        padding: 0.5rem;

          { id: 27, name: 'Limpiador de Vidrios', category: 'LIMPIADORES', price: 11, image: 'https://qrgqzzxgnsuubwyzbqzs.supabase.co/storage/v1/object/public/Productos/Limpiador%20de%20vidrios.jpg', description: 'Transparencia sin marcas.' },
          { id: 28, name: 'Limpiador de Interiores', category: 'REVIVIDOR DE INTERIORES', price: 11, image: 'https://qrgqzzxgnsuubwyzbqzs.supabase.co/storage/v1/object/public/Productos/Limpiador%20interiores.jpg', description: 'Limpieza profunda de tapizados y plásticos.' },
          { id: 29, name: 'Multiuso Pro', category: 'LIMPIADORES', price: 11, image: 'https://qrgqzzxgnsuubwyzbqzs.supabase.co/storage/v1/object/public/Productos/Multiuso.jpg', description: 'APC concentrado.' },
          { id: 30, name: 'Revitalizador', category: 'REVITALIZADOR DE EXTERIORES', price: 11, image: 'https://qrgqzzxgnsuubwyzbqzs.supabase.co/storage/v1/object/public/Productos/Revitalizador.jpg', description: 'Revitalizador de autopartes externas.' },
          { id: 31, name: 'Tratamientos', category: 'SELLADORES LÍQUIDOS', price: 11, image: 'https://qrgqzzxgnsuubwyzbqzs.supabase.co/storage/v1/object/public/Productos/tratamientos.jpg', description: 'Tratamiento acrílico/cerámico.' },
          { id: 32, name: 'Utilería Detailing', category: 'MERCHANDISING', price: 11, image: 'https://qrgqzzxgnsuubwyzbqzs.supabase.co/storage/v1/object/public/Productos/Utiletia.jpg', description: 'Accesorios útiles para el taller.' },
          { id: 33, name: 'V-Paint', category: 'SELLADORES CERÁMICOS', price: 11, image: 'https://qrgqzzxgnsuubwyzbqzs.supabase.co/storage/v1/object/public/Productos/V-Paint.jpg', description: 'Revestimiento cerámico para pintura.' }
        ];

        let currentCategory = 'Todos';

        // --- ACTIVACIÓN DEL PANEL ADMIN CON CTRL + SHIFT + Z ---
        const adminBtn = document.getElementById('btn-admin-modal');
        const modalAdmin = document.getElementById('modal-admin');
        const adminPinInput = document.getElementById('admin-pin');

        if (adminBtn) {
          adminBtn.style.setProperty('display', 'none', 'important');
        }

        function openAdminModal() {
          if (!modalAdmin) return;
          modalAdmin.classList.add('active');
          if (adminPinInput) {
            setTimeout(() => adminPinInput.focus(), 50);
          }
        }

        function closeAdminModal() {
          if (!modalAdmin) return;
          modalAdmin.classList.remove('active');
          if (adminPinInput) adminPinInput.value = '';
          resetForm();
        }

        window.addEventListener(
          'keydown',
          (event) => {
            const tag = event.target && event.target.tagName ? event.target.tagName.toLowerCase() : '';
            const isTyping =
              tag === 'input' ||
              tag === 'textarea' ||
              tag === 'select' ||
              Boolean(event.target && event.target.isContentEditable);
            if (isTyping) return;

            const isZ =
              event.code === 'KeyZ' ||
              (typeof event.key === 'string' && event.key.toLowerCase() === 'z');

            if (event.ctrlKey && event.shiftKey && !event.altKey && isZ) {
              event.preventDefault();
              event.stopPropagation();
              openAdminModal();
            }
          },
          true
        );
        // --------------------------------------------------------

        function updateUI() {
          document.getElementById('footer-title').innerText = settings.title;
          document.getElementById('doc-title').innerText = settings.title ? `${settings.title} | Limpieza y Estética Automotriz` : 'Toxic Store';
          document.getElementById('store-subtitle').innerText = settings.subtitle;
        }

        function renderCategories() {
          const filtersContainer = document.getElementById('category-filters');
          if (filtersContainer) {
            filtersContainer.innerHTML = `<button class="tag-btn ${currentCategory === 'Todos' ? 'active' : ''}" data-cat="Todos">Todos</button>`;
            categories.forEach(cat => {
              filtersContainer.innerHTML += `<button class="tag-btn ${currentCategory === cat ? 'active' : ''}" data-cat="${cat}">${cat}</button>`;
            });

            document.querySelectorAll('.tag-btn').forEach((btn) => {
              btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tag-btn').forEach((b) => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.getAttribute('data-cat');
                renderProducts();
              });
            });
          }

          const selectProdCat = document.getElementById('prod-category');
          if (selectProdCat) {
            selectProdCat.innerHTML = '';
            categories.forEach(cat => {
              selectProdCat.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
          }

          const adminCatList = document.getElementById('category-list-admin');
          if (adminCatList) {
            adminCatList.innerHTML = '';
            categories.forEach(cat => {
              adminCatList.innerHTML += `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.3rem 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
                  <span style="font-size: 0.85rem; color: #fff;">${cat}</span>
                  <button type="button" onclick="removeCategory('${cat}')" style="background: #e74c3c; color: #fff; border: none; padding: 0.2rem 0.5rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem;"><i class="fa-solid fa-trash"></i></button>
                </div>
              `;
            });
          }
        }

        window.addCategory = function() {
          const input = document.getElementById('new-category-input');
          const val = input.value.trim().toUpperCase();
          if (!val) return;
          if (categories.includes(val)) {
            alert('Ese separador ya existe.');
            return;
          }
          categories.push(val);
          input.value = '';
          renderCategories();
          saveSettingsToSupabase();
          alert('¡Separador añadido con éxito!');
        };

        window.removeCategory = function(catName) {
          if (categories.length <= 1) {
            alert('Debes tener al menos un separador.');
            return;
          }
          if (!confirm(`¿Eliminar el separador "${catName}"?`)) return;
          categories = categories.filter(c => c !== catName);
          if (currentCategory === catName) currentCategory = 'Todos';
          renderCategories();
          renderProducts();
          saveSettingsToSupabase();
        };

        function openExternalUrl(url) {
          if (!url) return;
          let target = url.trim();
          if (!target.startsWith('http://') && !target.startsWith('https://')) {
            target = 'https://' + target;
          }
          window.open(target, '_blank');
        }

        document.getElementById('btn-open-ig').addEventListener('click', () => {
          openExternalUrl(settings.instagram);
        });

        document.getElementById('btn-open-ws').addEventListener('click', () => {
          const cleanWs = String(settings.whatsapp).replace(/[^0-9]/g, '');
          window.open(`https://wa.me/${cleanWs}`, '_blank');
        });

        function renderProducts() {
          const container = document.getElementById('products-container');
          const searchInput = document.getElementById('search-input');
          const search = searchInput ? searchInput.value.toLowerCase() : '';

          container.innerHTML = '';

          const filtered = products.filter((p) => {
            const matchesCat = currentCategory === 'Todos' || p.category === currentCategory;
            const matchesSearch =
              p.name.toLowerCase().includes(search) ||
              (p.description && p.description.toLowerCase().includes(search));
            return matchesCat && matchesSearch;
          });

          if (filtered.length === 0) {
            container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">No hay productos para mostrar en esta categoría.</p>`;
          } else {
            const cleanWs = String(settings.whatsapp).replace(/[^0-9]/g, '');

            filtered.forEach((p) => {
              const message = encodeURIComponent(
                `Hola! Quiero consultar por el producto: ${p.name} ($${p.price})`
              );
              const wsLink = `https://wa.me/${cleanWs}?text=${message}`;

              container.innerHTML += `
                <div class="product-card">
                  <img src="${p.image}" class="product-img" alt="${p.name}">
                  <div class="product-info">
                    <div style="font-size: 0.75rem; color: var(--primary-gold); margin-bottom: 0.3rem; text-transform: uppercase;">${p.category}</div>
                    <div class="product-title">${p.name}</div>
                    <div class="product-desc">${p.description || ''}</div>
                    <div class="product-price">$${Number(p.price).toLocaleString('es-AR')}</div>
                    <button onclick="window.open('${wsLink}', '_blank')" class="buy-btn">
                      <i class="fa-brands fa-whatsapp"></i> Consultar
                    </button>
                  </div>
                </div>
              `;
            });
          }

          renderAdminProductList();
        }

        function renderAdminProductList() {
          const adminList = document.getElementById('admin-product-list');
          if (!adminList) return;

          adminList.innerHTML = '';
          if (products.length === 0) {
            adminList.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 0.5rem;">Sin productos.</p>`;
            return;
          }

          products.forEach((p) => {
            adminList.innerHTML += `
              <div class="admin-prod-item">
                <div class="admin-prod-info">
                  <img src="${p.image}" class="admin-prod-img" alt="${p.name}">
                  <div>
                    <strong style="color: #fff; font-size: 0.85rem;">${p.name}</strong><br>
                    <small style="color: var(--primary-gold);">${p.category} - $${Number(p.price).toLocaleString('es-AR')}</small>
                  </div>
                </div>
                <div class="admin-actions">
                  <button class="btn-edit-sm" onclick="editProduct('${p.id}')"><i class="fa-solid fa-pen"></i></button>
                  <button class="btn-delete-sm" onclick="deleteProduct('${p.id}')"><i class="fa-solid fa-trash"></i></button>
                </div>
              </div>
            `;
          });
        }

        window.editProduct = function (id) {
          const prod = products.find((p) => String(p.id) === String(id));
          if (!prod) return;

          document.getElementById('prod-id-edit').value = prod.id;
          document.getElementById('prod-name').value = prod.name;
          document.getElementById('prod-category').value = prod.category;
          document.getElementById('prod-price').value = prod.price;
          document.getElementById('prod-img').value = prod.image;
          document.getElementById('prod-desc').value = prod.description || '';

          document.getElementById('form-product-title').innerText = 'Modificar Producto';
          document.getElementById('btn-save-product').innerText = 'Actualizar Producto';
          document.getElementById('btn-cancel-edit').style.display = 'block';
        };

        window.deleteProduct = async function (id) {
          if (!confirm('¿Estás seguro de eliminar este producto?')) return;

          if (supabaseClient) {
            const { error } = await supabaseClient.from('products').delete().eq('id', id);
            if (error) {
              alert('Error al eliminar en Supabase: ' + error.message);
              return;
            }
          }

          products = products.filter((p) => String(p.id) !== String(id));
          alert('Producto eliminado correctamente.');
          syncSupabase();
        };

        document.getElementById('btn-cancel-edit').addEventListener('click', () => {
          resetForm();
        });

        function resetForm() {
          document.getElementById('prod-id-edit').value = '';
          document.getElementById('prod-name').value = '';
          document.getElementById('prod-price').value = '';
          document.getElementById('prod-img').value = '';
          document.getElementById('prod-desc').value = '';

          document.getElementById('form-product-title').innerText = 'Agregar / Editar Producto';
          document.getElementById('btn-save-product').innerText = 'Guardar Producto';
          document.getElementById('btn-cancel-edit').style.display = 'none';
        }

        if (adminBtn) {
          adminBtn.addEventListener('click', openAdminModal);
        }

        document.getElementById('close-admin-modal').addEventListener('click', closeAdminModal);

        window.verifyPin = function () {
          const pinInput = document.getElementById('admin-pin').value;
          if (pinInput === settings.pin) {
            document.getElementById('admin-login-sec').style.display = 'none';
            document.getElementById('admin-panel-sec').style.display = 'block';

            document.getElementById('input-store-title').value = settings.title;
            document.getElementById('input-store-subtitle').value = settings.subtitle;
            document.getElementById('input-store-ws').value = settings.whatsapp;
            document.getElementById('input-store-ig').value = settings.instagram;
            renderCategories();
          } else {
            alert('PIN incorrecto.');
          }
        };

        async function saveSettingsToSupabase() {
          if (supabaseClient) {
            await supabaseClient.from('store_settings').upsert({
              id: 'default',
              title: settings.title,
              subtitle: settings.subtitle,
              whatsapp: settings.whatsapp,
              instagram: settings.instagram,
              pin: settings.pin,
              categories: categories,
              updated_at: new Date(),
            });
          }
        }

        document.getElementById('btn-save-settings').addEventListener('click', async () => {
          settings.title = document.getElementById('input-store-title').value;
          settings.subtitle = document.getElementById('input-store-subtitle').value;
          settings.whatsapp = document.getElementById('input-store-ws').value;
          settings.instagram = document.getElementById('input-store-ig').value;

          await saveSettingsToSupabase();

          alert('¡Ajustes guardados correctamente!');
          updateUI();
          closeAdminModal();
          syncSupabase();
        });

        window.saveProduct = async function () {
          const editId = document.getElementById('prod-id-edit').value;
          const name = document.getElementById('prod-name').value;
          const category = document.getElementById('prod-category').value;
          const price = Number(document.getElementById('prod-price').value);
          const image = document.getElementById('prod-img').value;
          const description = document.getElementById('prod-desc').value;

          if (!name || !price || !image) {
            alert('Completa al menos el Nombre, Precio e Imagen.');
            return;
          }

          if (editId) {
            if (supabaseClient) {
              const { error } = await supabaseClient
                .from('products')
                .update({ name, category, price, image, description })
                .eq('id', editId);

              if (error) {
                alert('Error al actualizar: ' + error.message);
                return;
              }
            }
            alert('¡Producto actualizado exitosamente!');
          } else {
            if (supabaseClient) {
              const { error } = await supabaseClient
                .from('products')
                .insert([{ name, category, price, image, description }]);

              if (error) {
                alert('Error al guardar: ' + error.message);
                return;
              }
            }
            alert('¡Producto guardado exitosamente!');
          }

          resetForm();
          syncSupabase();
        };

        document.getElementById('search-input').addEventListener('input', renderProducts);

        async function syncSupabase() {
          if (supabaseClient) {
            try {
              const { data: sData } = await supabaseClient
                .from('store_settings')
                .select('*')
                .eq('id', 'default')
                .single();

              if (sData) {
                settings = sData;
                if (sData.categories && Array.isArray(sData.categories)) {
                  categories = sData.categories;
                }
              }
              updateUI();
              renderCategories();

              const { data: pData } = await supabaseClient
                .from('products')
                .select('*')
                .order('id', { ascending: true });

              if (pData && pData.length > 0) products = pData;
            } catch (e) {
              console.warn('Error al sincronizar Supabase:', e);
            }
          }
          renderCategories();
          renderProducts();
        }

        updateUI();
        syncSupabase();
      });
    </script>
  </body>
</html>
